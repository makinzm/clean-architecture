# lefthook.yml
# Pre-commit hooks for the Inference Gateway monorepo

pre-commit:
  commands:
    crawler-ruff-format:
      glob: "apps/inference-gateway/crawler/src/**/*.py"
      run: cd apps/inference-gateway/crawler && uv run ruff format .
    
    crawler-ruff-check:
      glob: "apps/inference-gateway/crawler/src/**/*.py"
      run: cd apps/inference-gateway/crawler && uv run ruff check . --fix
      
    crawler-ty-check:
      glob: "apps/inference-gateway/crawler/src/**/*.py"
      run: cd apps/inference-gateway/crawler && uv run ty check src

    crawler-test:
      glob: "apps/inference-gateway/crawler/**/*.py"
      run: cd apps/inference-gateway/crawler && export PYTHONPATH=src && uv run pytest
      
    rust-fmt:
      glob: "apps/inference-gateway/{server,ingest}/**/*.rs"
      run: bash -lc 'cd apps/inference-gateway/server && cargo fmt -- --check && cd ../ingest && cargo fmt -- --check'
      
    rust-clippy:
      glob: "apps/inference-gateway/{server,ingest}/**/*.rs"
      run: bash -lc 'cd apps/inference-gateway/server && cargo clippy -- -D warnings && cd ../ingest && cargo clippy -- -D warnings'
