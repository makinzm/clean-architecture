name: TypeScript Chess CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: typescript/chess/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: typescript/chess
      run: pnpm install --frozen-lockfile

    - name: Run unit tests
      working-directory: typescript/chess
      run: pnpm test run

    - name: Build packages and apps
      working-directory: typescript/chess
      run: pnpm -r build
