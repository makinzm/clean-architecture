name: CI Pipeline

on:
  push:
    branches: [ "main", "apps/ml-inference-gateway" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint Crawler with Ruff
        run: |
          cd apps/inference-gateway/crawler
          uv run ruff check .
      
      - name: Lint Training with Ruff
        run: |
          cd apps/inference-gateway/training
          uv run ruff check . --exclude eda

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run Tests
        run: |
          cd apps/inference-gateway/server
          cargo test --verbose

      - name: Run Clippy
        run: |
          cd apps/inference-gateway/server
          cargo clippy -- -D warnings
